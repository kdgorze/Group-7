<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picklers Profile</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script
      defer
      src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"
    ></script>
    <style>
      .settings-popout {
        position: fixed;
        top: 50%;
        right: -100%;
        transform: translateY(-50%);
        width: 300px;
        background: #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        transition: right 0.3s ease;
        z-index: 1000;
        padding: 1rem;
      }
      .settings-popout.is-active {
        right: 20px;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .main-content {
        flex: 1;
      }
      #notif-btn {
        position: relative;
        background: transparent;
        border: none;
        color: white;
      }
      #notif-count {
        position: absolute;
        top: -4px;
        right: -4px;
        background-color: #23d160;
        color: white;
        border-radius: 50%;
        padding: 2px 6px;
        font-size: 0.75rem;
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar has-background-black">
      <div class="navbar-brand">
        <a class="navbar-item has-text-white" href="pickler-pointer.html">
          <span class="ml-2 is-size-4">Picklers</span>
        </a>
        <div class="navbar-burger burger" data-target="navbarMenu">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div id="navbarMenu" class="navbar-menu has-background-black">
        <div class="navbar-start">
          <a class="navbar-item has-text-white" href="pickler-pointer.html"
            >Pickler Pointer</a
          >
          <a class="navbar-item has-text-white" href="leagues.html">Leagues</a>
          <a class="navbar-item has-text-white" href="profile.html">Profile</a>
          <a class="navbar-item has-text-white" href="courtTimes.html"
            >Courts</a
          >
        </div>
        <div class="navbar-end">
          <div class="navbar-item">
            <a class="has-text-white" id="navbar-greeting" href="profile.html"
              >Hello, Guest</a
            >
          </div>
          <div class="navbar-item">
            <button id="notif-btn">
              <span class="icon"><i class="fas fa-bell"></i></span>
              <span id="notif-count">0</span>
            </button>
          </div>
          <div class="navbar-item">
            <button class="button is-danger is-small" id="nav-logout-btn">
              Log Out
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <section class="section main-content">
      <div class="container">
        <div class="box">
          <div class="columns">
            <div class="column">
              <h1 class="title" id="user-name">Loading...</h1>
              <p class="subtitle" id="user-summary">Loading summary...</p>
              <p>
                <strong>🏠 Home Court:</strong>
                <span id="home-court">Loading...</span>
              </p>
            </div>
            <div class="column is-narrow">
              <button class="button is-primary" id="settings-button">
                Settings
              </button>
              <button
                class="button is-primary"
                id="action-btn"
                style="display: none"
              >
                Follow
              </button>
            </div>
          </div>

          <hr />

          <div>
            <h2 class="title is-4">Recent Matches</h2>
            <div id="recent-matches"><p>Loading matches...</p></div>
          </div>

          <hr />

          <div>
            <h2 class="title is-4">Friends</h2>
            <div id="friends-list"><p>Loading friends...</p></div>
          </div>
        </div>
      </div>
    </section>

    <!-- SETTINGS POPOUT -->
    <div class="settings-popout" id="settings-popout">
      <h2 class="title is-5">Settings</h2>
      <hr />
      <div class="field">
        <label class="label">Change Username</label>
        <div class="control">
          <input class="input" id="new-username" placeholder="New username" />
        </div>
      </div>
      <div class="field">
        <label class="label">Change Summary</label>
        <div class="control">
          <input class="input" id="new-summary" placeholder="New summary" />
        </div>
      </div>
      <div class="field">
        <label class="label">Change Home Court</label>
        <div class="control">
          <div class="select is-fullwidth">
            <select id="court-select">
              <option value="">Select a Court</option>
            </select>
          </div>
        </div>
      </div>
      <div class="field is-grouped">
        <div class="control">
          <button class="button is-success" id="save-settings">Save</button>
        </div>
        <div class="control">
          <button class="button is-light" id="close-settings">Cancel</button>
        </div>
      </div>
    </div>

    <!-- NOTIFICATIONS MODAL -->
    <div class="modal" id="notif-modal">
      <div class="modal-background"></div>
      <div class="modal-card">
        <header class="modal-card-head">
          <p class="modal-card-title">Notifications</p>
          <button class="delete" aria-label="close" id="notif-close"></button>
        </header>
        <section class="modal-card-body" id="notif-list"></section>
        <footer class="modal-card-foot">
          <button class="button is-light" id="notif-clear">
            Clear Notifications
          </button>
          <button class="button" id="notif-close-bottom">Close</button>
        </footer>
      </div>
    </div>

    <script>
      const BASE_URL = "https://seniorprojectapi-qm1k.onrender.com";

      let seenFollowerIds = new Set(
        JSON.parse(localStorage.getItem("seenFollowerIds") || "[]")
      );
      let seenReplyIds = new Set(
        JSON.parse(localStorage.getItem("seenReplyIds") || "[]")
      );

      let unreadFollowers = [],
        unreadReplies = [];

      function getCurrentUser() {
        const s = localStorage.getItem("currentUser");
        if (!s) {
          window.location.href = "index.html";
          return null;
        }
        return JSON.parse(s);
      }

      function updateBadge() {
        const total = unreadFollowers.length + unreadReplies.length;
        const b = document.getElementById("notif-count");
        if (total) {
          b.textContent = total;
          b.style.display = "inline-block";
        } else {
          b.style.display = "none";
        }
      }

      async function fetchNewFollowers() {
        const u = getCurrentUser();
        const r = await fetch(`${BASE_URL}/users/${u.id}/followers`);
        if (!r.ok) return;
        const arr = await r.json();
        unreadFollowers = arr.filter((x) => !seenFollowerIds.has(x.id));
      }

      async function fetchNewReplies() {
        const u = getCurrentUser();
        const r = await fetch(`${BASE_URL}/posts`);
        if (!r.ok) return;
        const posts = await r.json();
        const mine = new Set(
          posts.filter((p) => p.user_id === u.id).map((p) => p.id)
        );
        unreadReplies = posts.filter(
          (p) =>
            p.parent_post_id &&
            mine.has(p.parent_post_id) &&
            p.user_id !== u.id &&
            !seenReplyIds.has(p.id)
        );
      }

      function showNotifModal() {
        let html = "";
        if (!unreadFollowers.length && !unreadReplies.length) {
          html = "<p>No new notifications.</p>";
        } else {
          if (unreadFollowers.length) {
            html += "<h3 class='subtitle is-6'>New Followers</h3>";
            html += unreadFollowers
              .map(
                (u) =>
                  `<p><strong>@${u.username}</strong> started following you.</p>`
              )
              .join("");
          }
          if (unreadReplies.length) {
            html += "<h3 class='subtitle is-6 mt-4'>New Replies</h3>";
            html += unreadReplies
              .map(
                (r) =>
                  `<p><strong>@${r.username}</strong> replied: “${r.content}”</p>`
              )
              .join("");
          }
        }
        document.getElementById("notif-list").innerHTML = html;
        document.getElementById("notif-modal").classList.add("is-active");
      }

      function closeNotifModal() {
        document.getElementById("notif-modal").classList.remove("is-active");
      }

      function clearNotifications() {
        unreadFollowers.forEach((u) => seenFollowerIds.add(u.id));
        unreadReplies.forEach((r) => seenReplyIds.add(r.id));
        localStorage.setItem(
          "seenFollowerIds",
          JSON.stringify([...seenFollowerIds])
        );
        localStorage.setItem("seenReplyIds", JSON.stringify([...seenReplyIds]));
        unreadFollowers = [];
        unreadReplies = [];
        updateBadge();
        document.getElementById("notif-list").innerHTML =
          "<p>No new notifications.</p>";
      }

      async function isFollowing(cur, view) {
        const r = await fetch(`${BASE_URL}/users/${cur}/following`);
        if (!r.ok) return false;
        return (await r.json()).some((x) => String(x.id) === String(view));
      }

      function updateDOMProfile(u) {
        document.getElementById("user-name").textContent =
          u.username || "Unknown User";
        document.getElementById("user-summary").textContent =
          u.summary || "No summary provided.";
        document.getElementById("home-court").textContent =
          u.home_court || "Not set";
        document.getElementById("navbar-greeting").textContent =
          "Hello, " + u.username;
      }

      function loadProfileData() {
        const cur = getCurrentUser();
        const params = new URLSearchParams(window.location.search);
        const vid = params.get("userId") || cur.id;
        const own = String(vid) === String(cur.id);
        const sb = document.getElementById("settings-button");
        const ab = document.getElementById("action-btn");

        document.getElementById("navbar-greeting").textContent =
          "Hello, " + cur.username;

        if (own) {
          ab.style.display = "none";
        } else {
          sb.style.display = "none";
          ab.style.display = "inline-block";
          let following;
          isFollowing(cur.id, vid).then((f) => {
            following = f;
            ab.textContent = f ? "Unfollow" : "Follow";
          });
          ab.onclick = () => {
            fetch(`${BASE_URL}/follows`, {
              method: following ? "DELETE" : "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ follower_id: cur.id, followee_id: vid }),
            })
              .then((r) => {
                if (!r.ok) throw {};
                following = !following;
                ab.textContent = following ? "Unfollow" : "Follow";
              })
              .catch(() =>
                Swal.fire("Error", "Could not update follow", "error")
              );
          };
        }

        fetch(`${BASE_URL}/users/${vid}`)
          .then((r) => {
            if (!r.ok) throw {};
            return r.json();
          })
          .then((u) => {
            if (!params.get("userId"))
              localStorage.setItem("currentUser", JSON.stringify(u));
            updateDOMProfile(u);
          })
          .catch((e) => {
            console.error(e);
            document.getElementById("user-name").textContent =
              "Error loading profile";
          });
      }

      function loadRecentMatches() {
        const u = getCurrentUser(),
          c = document.getElementById("recent-matches");
        c.innerHTML = "<p>Loading matches...</p>";
        fetch(`${BASE_URL}/users/${u.id}/matches`)
          .then((r) => r.json())
          .then((arr) => {
            if (!arr.length) return (c.innerHTML = "<p>No recent matches.</p>");
            c.innerHTML = arr
              .map(
                (m) =>
                  `🏓 ${m.result} (${new Date(
                    m.played_at
                  ).toLocaleDateString()})`
              )
              .map((p) => `<p>${p}</p>`)
              .join("");
          })
          .catch(() => (c.innerHTML = "<p>Error loading matches.</p>"));
      }

      function loadFriends() {
        const u = getCurrentUser(),
          c = document.getElementById("friends-list");
        c.innerHTML = "<p>Loading friends...</p>";
        fetch(`${BASE_URL}/users/${u.id}/friends`)
          .then((r) => r.json())
          .then((arr) => {
            if (!arr.length) return (c.innerHTML = "<p>No friends found.</p>");
            c.innerHTML = arr.map((f) => `<p>🎾 ${f.username}</p>`).join("");
          })
          .catch(() => (c.innerHTML = "<p>Error loading friends.</p>"));
      }

      function loadCourtsDropdown() {
        const sel = document.getElementById("court-select");
        sel.innerHTML = '<option value="">Select a Court</option>';
        fetch(`${BASE_URL}/courts`)
          .then((r) => r.json())
          .then((arr) => {
            arr.forEach((c) => {
              const o = document.createElement("option");
              o.value = c.name;
              o.textContent = c.name;
              sel.appendChild(o);
            });
          })
          .catch(() => {
            /*ignore*/
          });
      }

      document.addEventListener("DOMContentLoaded", () => {
        // navbar burger
        document
          .querySelector(".navbar-burger")
          .addEventListener("click", (e) => {
            const b = e.currentTarget,
              m = document.getElementById(b.dataset.target);
            b.classList.toggle("is-active");
            m.classList.toggle("is-active");
          });

        // logout
        document
          .getElementById("nav-logout-btn")
          .addEventListener("click", () => {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
          });

        // notif button
        document
          .getElementById("notif-btn")
          .addEventListener("click", async () => {
            await fetchNewFollowers();
            await fetchNewReplies();
            updateBadge();
            showNotifModal();
          });
        document
          .getElementById("notif-close")
          .addEventListener("click", closeNotifModal);
        document
          .getElementById("notif-close-bottom")
          .addEventListener("click", closeNotifModal);
        document
          .getElementById("notif-clear")
          .addEventListener("click", clearNotifications);

        // settings popout
        document
          .getElementById("settings-button")
          .addEventListener("click", () =>
            document
              .getElementById("settings-popout")
              .classList.add("is-active")
          );
        document
          .getElementById("close-settings")
          .addEventListener("click", () =>
            document
              .getElementById("settings-popout")
              .classList.remove("is-active")
          );
        document
          .getElementById("save-settings")
          .addEventListener("click", () => {
            const cur = getCurrentUser();
            const nu = document.getElementById("new-username").value.trim();
            const ns = document.getElementById("new-summary").value.trim();
            const nc = document.getElementById("court-select").value;
            fetch(`${BASE_URL}/users/${cur.id}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: nu || cur.username,
                summary: ns || cur.summary,
                home_court: nc || cur.home_court,
              }),
            })
              .then((r) => r.json())
              .then((u) => {
                localStorage.setItem("currentUser", JSON.stringify(u));
                updateDOMProfile(u);
                document
                  .getElementById("settings-popout")
                  .classList.remove("is-active");
                Swal.fire(
                  "Saved!",
                  "Your settings have been updated.",
                  "success"
                );
              })
              .catch((e) => Swal.fire("Error", e.message, "error"));
          });

        // initial load
        loadProfileData();
        loadRecentMatches();
        loadFriends();
        loadCourtsDropdown();

        // initial notification fetch + badge update
        fetchNewFollowers().then(fetchNewReplies).then(updateBadge);

        // poll every minute
        setInterval(() => {
          fetchNewFollowers().then(fetchNewReplies).then(updateBadge);
        }, 60000);
      });
    </script>
  </body>
</html>
