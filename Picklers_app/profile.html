<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picklers Profile</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      .settings-popout {
        position: fixed;
        top: 50%;
        right: -100%;
        transform: translateY(-50%);
        width: 300px;
        background: #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        transition: right 0.3s ease;
        z-index: 1000;
      }
      .settings-popout.is-active {
        right: 20px;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar has-background-black">
      <div class="navbar-brand">
        <a class="navbar-item has-text-white" href="index.html">
          <span class="ml-2 is-size-4">Picklers</span>
        </a>
        <div class="navbar-burger burger" data-target="navbarMenu">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div id="navbarMenu" class="navbar-menu has-background-black">
        <div class="navbar-start">
          <a class="navbar-item has-text-white" href="index.html">Home</a>
          <a class="navbar-item has-text-white" href="tournament.html">Tournaments</a>
          <a class="navbar-item has-text-white" href="pickler-pointer.html">Pickler Pointer</a>
          <a class="navbar-item has-text-white" href="profile.html">Profile</a>
        </div>
        <div class="navbar-end" id="navbar-end">
          <!-- This area will be updated with greeting and logout button -->
        </div>
      </div>
    </nav>

    <!-- Main Profile Section -->
    <section class="section" id="profile-container">
      <div class="container">
        <div class="columns is-centered">
          <div class="column is-8">
            <div class="box">
              <div class="level">
                <div class="level-left">
                  <figure class="image is-128x128">
                    <img
                      class="is-rounded"
                      src="https://via.placeholder.com/128"
                      alt="Profile Picture"
                      id="profile-picture"
                    />
                  </figure>
                  <div class="ml-4">
                    <h1 class="title" id="user-name">Loading...</h1>
                    <p class="subtitle" id="user-summary">Loading...</p>
                    <p>
                      <strong>🏠 Home Court:</strong>
                      <span id="home-court">Loading...</span>
                    </p>
                  </div>
                </div>
                <div class="level-right">
                  <button class="button is-primary" id="settings-button">
                    Settings
                  </button>
                </div>
              </div>

              <hr />

              <div>
                <h2 class="title is-4">Recent Matches</h2>
                <div id="recent-matches">
                  <p>Loading matches...</p>
                </div>
              </div>

              <hr />

              <div>
                <h2 class="title is-4">Tournaments In</h2>
                <div id="tournaments">
                  <p>Loading tournaments...</p>
                </div>
              </div>

              <hr />

              <div>
                <h2 class="title is-4">Friends</h2>
                <div id="friends-list">
                  <p>Loading friends...</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Settings Popout -->
    <div class="settings-popout" id="settings-popout">
      <div class="p-4">
        <h2 class="title is-5">Settings</h2>
        <hr />
        <div class="field">
          <label class="label">Change Username</label>
          <div class="control">
            <input class="input" type="text" id="username-input" placeholder="New username" />
          </div>
        </div>
        <div class="field">
          <label class="label">Change Summary</label>
          <div class="control">
            <input class="input" type="text" id="summary-input" placeholder="New summary" />
          </div>
        </div>
        <div class="field">
          <label class="label">Change Home Court</label>
          <div class="control">
            <input class="input" type="text" id="court-input" placeholder="New home court" />
          </div>
        </div>
        <div class="field is-grouped">
          <div class="control">
            <button class="button is-success" id="save-settings">Save</button>
          </div>
          <div class="control">
            <button class="button is-light" id="close-settings">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Ensure cookies are sent with Axios requests
      axios.defaults.withCredentials = true;

      // Store /me response in a variable to avoid multiple calls
      let currentUser = null;

      // Fetch current user data via GET /me
      axios.get("http://localhost:3000/me")
        .then(response => {
          currentUser = response.data;
          document.getElementById("user-name").textContent = currentUser.username;
          document.getElementById("user-summary").textContent = currentUser.summary || "No summary available";
          document.getElementById("home-court").textContent = currentUser.home_court || "Not set";
          if (currentUser.profile_picture) {
            document.getElementById("profile-picture").src = currentUser.profile_picture;
            document.getElementById("navbar-avatar").src = currentUser.profile_picture;
          }
          // Update navbar with greeting and logout button
          document.getElementById("navbar-end").innerHTML = `
            <div class="navbar-item has-text-white">Hello, ${currentUser.username}</div>
            <div class="navbar-item">
              <button id="logout-btn" class="button is-danger">Log Out</button>
            </div>
          `;
        })
        .catch(error => {
          console.error("Error loading profile data:", error);
          // Instead of redirecting immediately, show an error message
          document.getElementById("profile-container").innerHTML = "<h1>Error loading profile data. Please sign in.</h1>";
        });

      // Logout functionality using POST /logout
      document.addEventListener("click", function(e) {
        if (e.target && e.target.id === "logout-btn") {
          axios.post("http://localhost:3000/logout")
            .then(() => {
              window.location.href = "index.html";
            })
            .catch(error => {
              console.error("Logout error:", error);
              alert("Logout failed. Please try again.");
            });
        }
      });

      // Load recent matches for current user
      axios.get("http://localhost:3000/matches")
        .then(response => {
          const matches = response.data;
          if (!currentUser) {
            // If /me hasn't loaded yet, wait and then filter
            return axios.get("http://localhost:3000/me").then(res => {
              currentUser = res.data;
              return matches;
            });
          }
          return matches;
        })
        .then(matches => {
          const userMatches = matches.filter(
            match => match.player1_id == currentUser.id || match.player2_id == currentUser.id
          );
          const matchesContainer = document.getElementById("recent-matches");
          if (userMatches.length === 0) {
            matchesContainer.innerHTML = "<p>No matches found.</p>";
          } else {
            matchesContainer.innerHTML = userMatches
              .map(match => `<p>Match ${match.id} | Score: ${match.score} | Played: ${match.played_at}</p>`)
              .join("");
          }
        })
        .catch(error => {
          console.error("Error loading matches:", error);
          document.getElementById("recent-matches").innerHTML = "<p>Error loading matches.</p>";
        });

      // Load tournaments for current user (filter by tournaments created by current user)
      axios.get("http://localhost:3000/tournaments")
        .then(response => {
          if (!currentUser) {
            return axios.get("http://localhost:3000/me").then(res => {
              currentUser = res.data;
              return response.data;
            });
          }
          return response.data;
        })
        .then(tournaments => {
          const userTournaments = tournaments.filter(
            tournament => tournament.created_by == currentUser.id
          );
          const tournamentsContainer = document.getElementById("tournaments");
          if (userTournaments.length === 0) {
            tournamentsContainer.innerHTML = "<p>No tournaments found.</p>";
          } else {
            tournamentsContainer.innerHTML = userTournaments
              .map(tournament => `<p>${tournament.title} - ${tournament.subtitle}</p>`)
              .join("");
          }
        })
        .catch(err => {
          console.error("Error loading tournaments:", err);
          document.getElementById("tournaments").innerHTML = "<p>Error loading tournaments.</p>";
        });

      // Load friends (users that current user is following)
      axios.get("http://localhost:3000/me")
        .then(res => {
          currentUser = res.data;
          return axios.get("http://localhost:3000/users/" + currentUser.id + "/following");
        })
        .then(response => {
          const friends = response.data;
          const friendsContainer = document.getElementById("friends-list");
          if (friends.length === 0) {
            friendsContainer.innerHTML = "<p>No friends found.</p>";
          } else {
            friendsContainer.innerHTML = friends
              .map(friend => `<p>${friend.username}</p>`)
              .join("");
          }
        })
        .catch(err => {
          console.error("Error loading friends:", err);
          document.getElementById("friends-list").innerHTML = "<p>Error loading friends.</p>";
        });

      // Settings Popout Handlers
      const settingsButton = document.getElementById("settings-button");
      const settingsPopout = document.getElementById("settings-popout");
      const closeSettings = document.getElementById("close-settings");

      settingsButton.addEventListener("click", () => {
        settingsPopout.classList.add("is-active");
      });

      closeSettings.addEventListener("click", () => {
        settingsPopout.classList.remove("is-active");
      });

      document.getElementById("save-settings").addEventListener("click", () => {
        const newUsername = document.getElementById("username-input").value;
        const newSummary = document.getElementById("summary-input").value;
        const newCourt = document.getElementById("court-input").value;

        axios.put("http://localhost:3000/me", {
          username: newUsername,
          summary: newSummary,
          home_court: newCourt
        })
          .then(response => {
            const updatedUser = response.data;
            document.getElementById("user-name").textContent = updatedUser.username;
            document.getElementById("user-summary").textContent = updatedUser.summary || "No summary available";
            document.getElementById("home-court").textContent = updatedUser.home_court || "Not set";
            settingsPopout.classList.remove("is-active");
            // Update navbar greeting
            document.getElementById("navbar-end").innerHTML = `
              <div class="navbar-item has-text-white">Hello, ${updatedUser.username}</div>
              <div class="navbar-item">
                <button id="logout-btn" class="button is-danger">Log Out</button>
              </div>
            `;
          })
          .catch(err => {
            console.error("Error updating settings:", err);
            alert("Failed to update settings.");
          });
      });
    </script>
  </body>
</html>
