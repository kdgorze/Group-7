<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picklers Profile</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
    />
    <!-- SweetAlert2 for popups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      .settings-popout {
        position: fixed;
        top: 50%;
        right: -100%;
        transform: translateY(-50%);
        width: 300px;
        background: #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        transition: right 0.3s ease;
        z-index: 1000;
        padding: 1rem;
      }
      .settings-popout.is-active {
        right: 20px;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .main-content {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <nav class="navbar has-background-black">
      <div class="navbar-brand">
        <a class="navbar-item has-text-white" href="pickler-pointer.html">
          <span class="ml-2 is-size-4">Picklers</span>
        </a>
        <div class="navbar-burger burger" data-target="navbarMenu">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div id="navbarMenu" class="navbar-menu has-background-black">
        <div class="navbar-start">
          <a class="navbar-item has-text-white" href="pickler-pointer.html"
            >Pickler Pointer</a
          >
          <a class="navbar-item has-text-white" href="leagues.html">Leagues</a>
          <a class="navbar-item has-text-white" href="profile.html">Profile</a>
          <a class="navbar-item has-text-white" href="courtTimes.html"
            >Court Times</a
          >
        </div>
        <div class="navbar-end">
          <div class="navbar-item">
            <a class="has-text-white" id="navbar-greeting" href="profile.html"
              >Hello, Guest</a
            >
          </div>
          <div class="navbar-item">
            <button class="button is-danger is-small" id="nav-logout-btn">
              Log Out
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Section -->
    <section class="section main-content">
      <div class="container">
        <div class="box">
          <div class="columns">
            <div class="column">
              <h1 class="title" id="user-name">Loading...</h1>
              <p class="subtitle" id="user-summary">Loading summary...</p>
              <p>
                <strong>🏠 Home Court:</strong>
                <span id="home-court">Loading...</span>
              </p>
            </div>
            <div class="column is-narrow">
              <!-- Settings for own profile, replaced by Follow/Unfollow on others -->
              <button class="button is-primary" id="settings-button">Settings</button>
              <button class="button is-primary" id="action-btn" style="display:none;">Follow</button>
            </div>
          </div>

          <hr />

          <div>
            <h2 class="title is-4">Recent Matches</h2>
            <div id="recent-matches">
              <p>Loading matches...</p>
            </div>
          </div>

          <hr />

          <div>
            <h2 class="title is-4">Friends</h2>
            <div id="friends-list">
              <p>Loading friends...</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Settings Popout -->
    <div class="settings-popout" id="settings-popout">
      <h2 class="title is-5">Settings</h2>
      <hr />
      <div class="field">
        <label class="label">Change Username</label>
        <div class="control">
          <input
            class="input"
            type="text"
            id="new-username"
            placeholder="New username"
          />
        </div>
      </div>
      <div class="field">
        <label class="label">Change Summary</label>
        <div class="control">
          <input
            class="input"
            type="text"
            id="new-summary"
            placeholder="New summary"
          />
        </div>
      </div>
      <div class="field">
        <label class="label">Change Home Court</label>
        <div class="control">
          <div class="select is-fullwidth">
            <select id="court-select">
              <option value="">Select a Court</option>
            </select>
          </div>
        </div>
      </div>
      <div class="field is-grouped">
        <div class="control">
          <button class="button is-success" id="save-settings">Save</button>
        </div>
        <div class="control">
          <button class="button is-light" id="close-settings">Cancel</button>
        </div>
      </div>
    </div>

    <script>
      const BASE_URL = "https://seniorprojectapi-qm1k.onrender.com";

      function getCurrentUser() {
        const stored = localStorage.getItem("currentUser");
        if (!stored) {
          window.location.href = "index.html";
          return null;
        }
        return JSON.parse(stored);
      }

      function updateDOMProfile(user) {
        document.getElementById("user-name").textContent =
          user.username || "Unknown User";
        document.getElementById("user-summary").textContent =
          user.summary || "No summary provided.";
        document.getElementById("home-court").textContent =
          user.home_court || "Not set";
        document.getElementById("navbar-greeting").textContent =
          "Hello, " + (user.username || "Guest");
      }

      async function isFollowing(currentId, viewedId) {
        const res = await fetch(`${BASE_URL}/users/${currentId}/following`);
        if (!res.ok) return false;
        const list = await res.json();
        return list.some(u => String(u.id) === String(viewedId));
      }

      function loadProfileData() {
        const currentUser = getCurrentUser();
        const params = new URLSearchParams(window.location.search);
        const viewedUserId = params.get("userId") || currentUser.id;
        const isOwn = String(viewedUserId) === String(currentUser.id);

        const settingsBtn = document.getElementById("settings-button");
        const actionBtn = document.getElementById("action-btn");

        if (isOwn) {
          actionBtn.style.display = "none";
        } else {
          settingsBtn.style.display = "none";
          actionBtn.style.display = "inline-block";
          isFollowing(currentUser.id, viewedUserId).then(following => {
            actionBtn.textContent = following ? "Unfollow" : "Follow";
            actionBtn.onclick = () => {
              fetch(`${BASE_URL}/follows`, {
                method: following ? "DELETE" : "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({
                  follower_id: currentUser.id,
                  followee_id: viewedUserId
                })
              })
                .then(r => {
                  if (!r.ok) throw new Error();
                  following = !following;
                  actionBtn.textContent = following ? "Unfollow" : "Follow";
                })
                .catch(() => Swal.fire("Error"));
            };
          });
        }

        fetch(`${BASE_URL}/users/${viewedUserId}`)
          .then(res => {
            if (!res.ok) throw new Error("Failed to fetch user profile");
            return res.json();
          })
          .then(user => {
            if (!params.get("userId")) {
              localStorage.setItem("currentUser", JSON.stringify(user));
            }
            updateDOMProfile(user);
          })
          .catch(err => {
            console.error("Error loading profile:", err);
            document.getElementById("user-name").textContent =
              "Error loading profile";
          });
      }

      function loadRecentMatches() {
        const u = getCurrentUser();
        const container = document.getElementById("recent-matches");
        container.innerHTML = "<p>Loading matches...</p>";
        fetch(`${BASE_URL}/users/${u.id}/matches`)
          .then(res => res.json())
          .then(arr => {
            if (!arr.length) return container.innerHTML = "<p>No recent matches.</p>";
            container.innerHTML = arr
              .map(m => `<p>🏓 ${m.result} (${new Date(m.played_at).toLocaleDateString()})</p>`)
              .join("");
          })
          .catch(() => {
            container.innerHTML = "<p>Error loading matches.</p>";
          });
      }

      function loadFriends() {
        const u = getCurrentUser();
        const container = document.getElementById("friends-list");
        container.innerHTML = "<p>Loading friends...</p>";
        fetch(`${BASE_URL}/users/${u.id}/friends`)
          .then(res => res.json())
          .then(arr => {
            if (!arr.length) return container.innerHTML = "<p>No friends found.</p>";
            container.innerHTML = arr.map(f => `<p>🎾 ${f.username}</p>`).join("");
          })
          .catch(() => {
            container.innerHTML = "<p>Error loading friends.</p>";
          });
      }

      function loadCourtsDropdown() {
        const select = document.getElementById("court-select");
        select.innerHTML = '<option value="">Select a Court</option>';
        fetch(`${BASE_URL}/courts`)
          .then(res => res.json())
          .then(arr => {
            arr.forEach(c => {
              const opt = document.createElement("option");
              opt.value = c.name;
              opt.textContent = c.name;
              select.appendChild(opt);
            });
          })
          .catch(() => {});
      }

      document.addEventListener("DOMContentLoaded", () => {
        const burger = document.querySelector(".navbar-burger");
        const menu = document.getElementById("navbarMenu");
        burger.addEventListener("click", () => {
          burger.classList.toggle("is-active");
          menu.classList.toggle("is-active");
        });

        document.getElementById("nav-logout-btn").addEventListener("click", () => {
          localStorage.removeItem("currentUser");
          window.location.href = "index.html";
        });

        loadProfileData();
        loadRecentMatches();
        loadFriends();
        loadCourtsDropdown();

        // Settings popout logic still intact...
        const settingsButton = document.getElementById("settings-button");
        const settingsPopout = document.getElementById("settings-popout");
        const closeSettings = document.getElementById("close-settings");
        settingsButton.addEventListener("click", () => settingsPopout.classList.add("is-active"));
        closeSettings.addEventListener("click", () => settingsPopout.classList.remove("is-active"));
        document.getElementById("save-settings").addEventListener("click", () => {
          const currentUser = getCurrentUser();
          if (!currentUser) return;
          const newUsername = document.getElementById("new-username").value.trim();
          const newSummary = document.getElementById("new-summary").value.trim();
          const newHomeCourt = document.getElementById("court-select").value;
          const payload = {
            username: newUsername || currentUser.username,
            summary: newSummary || currentUser.summary,
            home_court: newHomeCourt || currentUser.home_court,
          };
          fetch(`${BASE_URL}/users/${currentUser.id}`, {
            method: "PATCH",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(payload),
          })
            .then(r => r.json())
            .then(updatedUser => {
              localStorage.setItem("currentUser", JSON.stringify(updatedUser));
              updateDOMProfile(updatedUser);
              settingsPopout.classList.remove("is-active");
              Swal.fire("Saved!", "Your settings have been updated.", "success");
            })
            .catch(err => Swal.fire("Error", err.message, "error"));
        });
      });
    </script>
  </body>
</html>
