    <!-- Modal for Creating a New Post -->
    <div class="modal" id="post-modal">
      <div class="modal-background"></div>
      <div class="modal-card">
        <header class="modal-card-head">
          <p class="modal-card-title">Create a New Post</p>
          <button class="delete" aria-label="close" id="close-post-modal"></button>
        </header>
        <section class="modal-card-body">
          <textarea
            id="modal-post-content"
            class="textarea"
            placeholder="What's on your mind?"
          ></textarea>
        </section>
        <footer class="modal-card-foot">
          <button class="button is-success" id="modal-post-btn">Post</button>
          <button class="button" id="cancel-post-btn">Cancel</button>
        </footer>
      </div>
    </div>

    <script>
      const BASE_URL = "http://localhost:3000";

      document.addEventListener("DOMContentLoaded", () => {
        // If user is not logged in, redirect to index.html
        const storedUser = localStorage.getItem("currentUser");
        if (!storedUser) {
          window.location.href = "index.html";
          return;
        }

        // Navbar burger toggle
        const burger = document.querySelector(".burger");
        const menu = document.getElementById(burger.dataset.target);
        burger.addEventListener("click", () => {
          burger.classList.toggle("is-active");
          menu.classList.toggle("is-active");
        });

        // Load feed (real posts from /posts)
        loadRealPosts();
        // Load courts from /courts
        loadRealCourts();
        // Setup follow buttons
        setupFollowButtons();

        // Setup post modal handlers
        document.getElementById("open-post-modal").addEventListener("click", openPostModal);
        document.getElementById("cancel-post-btn").addEventListener("click", closePostModal);
        document.getElementById("close-post-modal").addEventListener("click", closePostModal);
        document.getElementById("modal-post-btn").addEventListener("click", createPost);
      });

      // -----------------------------
      // Load real posts from GET /posts
      // -----------------------------
      function loadRealPosts() {
        const feed = document.getElementById("feed");
        feed.innerHTML = "<p>Loading posts...</p>";
        fetch(`${BASE_URL}/posts`)
          .then(res => {
            if (!res.ok) throw new Error("Failed to fetch posts");
            return res.json();
          })
          .then(posts => {
            if (!Array.isArray(posts) || posts.length === 0) {
              feed.innerHTML = "<p>No posts yet.</p>";
              return;
            }
            feed.innerHTML = posts.map(post => {
              const dateStr = new Date(post.created_at).toLocaleString();
              return `
                <div class="feed-post">
                  <p><strong>${post.username}</strong> posted: ${post.content}</p>
                  <small>${dateStr}</small>
                </div>
              `;
            }).join("");
          })
          .catch(err => {
            feed.innerHTML = `<p>Error loading posts: ${err.message}</p>`;
          });
      }

      // -----------------------------
      // Create a new post (POST /posts)
      // -----------------------------
      function createPost() {
        const storedUser = localStorage.getItem("currentUser");
        if (!storedUser) {
          alert("You must be logged in to post.");
          return;
        }
        const userObj = JSON.parse(storedUser);
        const content = document.getElementById("modal-post-content").value.trim();
        if (!content) {
          alert("Please enter some content for your post.");
          return;
        }
        const payload = {
          user_id: userObj.id,
          content
        };
        fetch(`${BASE_URL}/posts`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
          .then(res => {
            if (!res.ok) throw new Error("Failed to create post");
            return res.json();
          })
          .then(newPost => {
            closePostModal();
            // Reload posts
            loadRealPosts();
          })
          .catch(err => {
            alert(`Error: ${err.message}`);
          });
      }

      // -----------------------------
      // Load real courts from GET /courts
      // -----------------------------
      function loadRealCourts() {
        const courtsList = document.getElementById("courts-list");
        courtsList.innerHTML = "<tr><td colspan='2'>Loading courts...</td></tr>";
        fetch(`${BASE_URL}/courts`)
          .then(res => {
            if (!res.ok) throw new Error("Failed to fetch courts");
            return res.json();
          })
          .then(courts => {
            if (!Array.isArray(courts) || courts.length === 0) {
              courtsList.innerHTML = "<tr><td colspan='2'>No courts found.</td></tr>";
              return;
            }
            courtsList.innerHTML = courts.map(court => `
              <tr>
                <td>${court.name}</td>
                <td>${court.address}</td>
              </tr>
            `).join("");
          })
          .catch(err => {
            courtsList.innerHTML = `<tr><td colspan='2'>Error: ${err.message}</td></tr>`;
          });
      }

      // -----------------------------
      // Follow logic
      // 1) Look up friend by username => GET /users?username=...
      // 2) POST /follows with { follower_id, followee_id }
      // -----------------------------
      function setupFollowButtons() {
        document.querySelectorAll(".follow-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            followFriend(btn.getAttribute("data-username"), btn);
          });
        });
      }

      function followFriend(friendUsername, button) {
        button.disabled = true;
        const storedUser = localStorage.getItem("currentUser");
        if (!storedUser) {
          alert("You must be logged in to follow someone.");
          button.disabled = false;
          return;
        }
        const currentUser = JSON.parse(storedUser);

        // 1) Find friend user_id by username
        fetch(`${BASE_URL}/users?username=${friendUsername}`)
          .then(res => {
            if (!res.ok) throw new Error("User not found");
            return res.json();
          })
          .then(friend => {
            // friend should contain { id, username, ... }
            const friendId = friend.id;
            // 2) POST /follows
            return fetch(`${BASE_URL}/follows`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                follower_id: currentUser.id,
                followee_id: friendId
              })
            });
          })
          .then(res => {
            if (!res.ok) throw new Error("Failed to follow user");
            // Toggle button text
            if (button.textContent.trim() === "Follow") {
              button.textContent = "Following";
              button.classList.remove("is-primary");
              button.classList.add("is-success");
            } else {
              button.textContent = "Follow";
              button.classList.remove("is-success");
              button.classList.add("is-primary");
            }
            button.disabled = false;
          })
          .catch(err => {
            alert(`Error: ${err.message}`);
            button.disabled = false;
          });
      }

      // -----------------------------
      // Modal open/close
      // -----------------------------
      function openPostModal() {
        document.getElementById("post-modal").classList.add("is-active");
      }

      function closePostModal() {
        document.getElementById("post-modal").classList.remove("is-active");
      }
    </script>
  </body>
