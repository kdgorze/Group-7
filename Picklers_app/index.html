<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picklers - Login</title>

    <!-- Bulma CSS over HTTP -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css"
    />
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      /* Make the page take full height, so hero can be centered */
      html, body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .main-content {
        flex: 1;
      }
      /* Hero styling for the login form */
      .hero .input,
      .hero .button {
        max-width: 300px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <!-- Minimal Navbar (Optional) -->
    <nav class="navbar has-background-black">
      <div class="navbar-brand">
        <a class="navbar-item has-text-white" href="#">
          <span class="ml-2 is-size-4">Picklers</span>
        </a>
      </div>
    </nav>

    <!-- Hero Section for Login/Registration -->
    <section class="hero is-primary is-fullheight">
      <div class="hero-body">
        <div class="container has-text-centered">
          <h1 class="title">Welcome to Picklers</h1>
          <h2 class="subtitle">Please Log In or Register</h2>

          <!-- Login Form -->
          <div id="login-form">
            <input
              type="text"
              id="username-input"
              class="input is-medium"
              placeholder="Username"
            />
            <br /><br />
            <input
              type="password"
              id="password-input"
              class="input is-medium"
              placeholder="Password"
            />
            <br /><br />
            <button id="login-btn" class="button is-link is-medium">Log In</button>
            <br /><br />
            <button id="register-btn" class="button is-info is-medium">Register</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer has-background-primary has-text-white">
      <div class="content has-text-centered">
        <p>&copy; 2025 Picklers App | Built with ❤️ from group-7</p>
      </div>
    </footer>

    <script>
      const BASE_URL = "https://seniorprojectapi-qm1k.onrender.com";

      document.addEventListener("DOMContentLoaded", () => {
        // If user is already logged in, redirect to pickler-pointer immediately
        const storedUser = localStorage.getItem("currentUser");
        if (storedUser) {
          window.location.href = "pickler-pointer.html";
          return;
        }
      });

      // Login
      document.getElementById("login-btn").addEventListener("click", () => {
        const username = document.getElementById("username-input").value.trim();
        const password = document.getElementById("password-input").value.trim();

        if (!username || !password) {
          Swal.fire("Error", "Please enter both username and password.", "error");
          return;
        }

        fetch(`${BASE_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        })
          .then(res => {
            if (!res.ok) throw new Error("Invalid credentials");
            return res.json();
          })
          .then(user => {
            // Store entire user object in localStorage
            localStorage.setItem("currentUser", JSON.stringify(user));
            // Redirect to pickler-pointer
            window.location.href = "pickler-pointer.html";
          })
          .catch(err => {
            Swal.fire("Error", err.message, "error");
          });
      });

      // Register
      document.getElementById("register-btn").addEventListener("click", () => {
        Swal.fire({
          title: "Register New Account",
          html: `
            <input id="swal-reg-username" class="swal2-input" placeholder="Username">
            <input id="swal-reg-email" class="swal2-input" placeholder="Email">
            <input id="swal-reg-password" type="password" class="swal2-input" placeholder="Password">
          `,
          focusConfirm: false,
          showCancelButton: true,
          preConfirm: () => {
            const username = document.getElementById("swal-reg-username").value.trim();
            const email = document.getElementById("swal-reg-email").value.trim();
            const password = document.getElementById("swal-reg-password").value.trim();
            if (!username || !email || !password) {
              Swal.showValidationMessage("Please fill in all fields");
            }
            return { username, email, password };
          }
        }).then(result => {
          if (result.isConfirmed) {
            fetch(`${BASE_URL}/register`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(result.value)
            })
              .then(res => {
                if (!res.ok) throw new Error("Registration failed");
                return res.json();
              })
              .then(() => {
                Swal.fire("Success", "Registration successful! Please log in.", "success");
              })
              .catch(err => {
                Swal.fire("Error", err.message, "error");
              });
          }
        });
      });
    </script>
  </body>
</html>
