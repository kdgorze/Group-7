<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Picklers - Court Availability</title>

  <!-- Bulma -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css" />
  <!-- Bulma Carousel -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma-carousel/4.0.4/bulma-carousel.min.css" />

  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .main-content {
      flex: 1;
      padding: 2rem;
    }
    .carousel img {
      max-height: 300px;
      object-fit: contain;
      margin: auto;
    }
    .court-section {
      margin-bottom: 3rem;
    }
    /* Custom styling for carousel navigation arrows */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 30px;
      color: white;
      background-color: rgba(0, 0, 0, 0.5);
      border: none;
      padding: 10px;
      cursor: pointer;
    }

    .left {
      left: 0;
    }

    .right {
      right: 0;
    }

    /* Styling for dots navigation */
    .dots {
      text-align: center;
      padding: 10px;
    }

    .dot {
      display: inline-block;
      height: 15px;
      width: 15px;
      margin: 0 5px;
      background-color: #bbb;
      border-radius: 50%;
      cursor: pointer;
    }

    .active-dot {
      background-color: #717171;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar has-background-black">
    <div class="navbar-brand">
      <a class="navbar-item has-text-white" href="pickler-pointer.html">
        <span class="ml-2 is-size-4">Picklers</span>
      </a>
      <div class="navbar-burger burger" data-target="navbarMenu">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div id="navbarMenu" class="navbar-menu has-background-black">
      <div class="navbar-start">
        <a class="navbar-item has-text-white" href="pickler-pointer.html">
          Pickler Pointer
        </a>
        <a class="navbar-item has-text-white" href="leagues.html">Leagues</a>
        <a class="navbar-item has-text-white" href="profile.html">Profile</a>
        <a class="navbar-item has-text-white" href="courtTimes.html">
          Court Times
        </a>
      </div>
      <div class="navbar-end">
        <div class="navbar-item">
          <a class="has-text-white" id="navbar-greeting" href="profile.html">
            Hello, Guest
          </a>
        </div>
        <div class="navbar-item">
          <button class="button is-danger is-small" id="nav-logout-btn">
            Log Out
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <section class="main-content container">
    <h1 class="title has-text-centered">Court Availability</h1>

    <!-- Courts -->
    <div id="court-list">
      <!-- Court Items Injected via JS -->
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer has-background-primary has-text-white">
    <div class="content has-text-centered">
      <p>&copy; 2025 Picklers App | Built with ❤️ from group-7</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bulma-carousel/4.0.4/bulma-carousel.min.js"></script>
  <script>
    const courts = [
      "Allegheny Commons Park",
      "West Penn Community Recreation Center",
      "Moore Park",
      "GreenTree SportsPlex and Fitness Center",
      "The Pickleball Warehouse",
      "The Pickleball Warehouse"
    ];

    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const courtList = document.getElementById("court-list");

    courts.forEach((court, index) => {
      const section = document.createElement("div");
      section.className = "court-section";

      section.innerHTML = `
        <h2 class="title is-4">${court}</h2>
        <div class="carousel-container" id="carousel-${index}">
          <div class="carousel-images">
            ${days.map(day => `
              <img src="https://via.placeholder.com/800x500?text=${court}+${day}" alt="${court} - ${day}">
            `).join("")}
          </div>
          <button class="arrow left" onclick="moveSlide(${index}, -1)">&#10094;</button>
          <button class="arrow right" onclick="moveSlide(${index}, 1)">&#10095;</button>
          <div class="dots" id="dots-${index}">
            ${days.map((_, i) => `<span class="dot" onclick="currentSlide(${index}, ${i})"></span>`).join('')}
          </div>
        </div>
      `;

      courtList.appendChild(section);
    });

    let currentIndex = Array(courts.length).fill(0);

    function moveSlide(courtIndex, step) {
      currentIndex[courtIndex] += step;
      const totalSlides = days.length;
      if (currentIndex[courtIndex] < 0) currentIndex[courtIndex] = totalSlides - 1;
      if (currentIndex[courtIndex] >= totalSlides) currentIndex[courtIndex] = 0;
      updateCarousel(courtIndex);
    }

    function currentSlide(courtIndex, index) {
      currentIndex[courtIndex] = index;
      updateCarousel(courtIndex);
    }

    function updateCarousel(courtIndex) {
      const slides = document.querySelectorAll(`#carousel-${courtIndex} .carousel-images img`);
      const dots = document.querySelectorAll(`#dots-${courtIndex} .dot`);
      const carousel = document.querySelector(`#carousel-${courtIndex} .carousel-images`);

      carousel.style.transform = `translateX(${-currentIndex[courtIndex] * 100}%)`;

      dots.forEach(dot => dot.classList.remove('active-dot'));
      dots[currentIndex[courtIndex]].classList.add('active-dot');
    }

    // Initialize carousels
    courts.forEach((_, index) => updateCarousel(index));
  </script>

</body>
</html>
