<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Picklers - Court Availability</title>

  <!-- Bulma -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css" />
  <!-- Bulma Carousel -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma-carousel/4.0.4/bulma-carousel.min.css" />

  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .main-content {
      flex: 1;
      padding: 2rem;
    }
    .court-section {
      margin-bottom: 3rem;
    }
    
    /* Carousel Container */
    .carousel-container {
    position: relative;
    width: 80%; /* Adjust this percentage as needed */
    max-width: 800px; /* Or set a fixed maximum width */
    overflow: hidden;
    margin: 0 auto;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
  
  /* Carousel Images Container */
  .carousel-images {
    display: flex;
    transition: transform 0.5s ease-in-out;
    width: 100%;
  }
  
  /* Individual Carousel Image */
  .carousel-images img {
    min-width: 100%;
    height: 300px; /* Set your desired height */
    width: auto; /* Maintain aspect ratio */
    object-fit: contain; /* Ensures whole image is visible */
    background-color: #f5f5f5;
    margin: 0 auto; /* Center the image */
  }
    
    /* Custom styling for carousel navigation arrows */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 30px;
      color: white;
      background-color: rgba(0, 0, 0, 0.5);
      border: none;
      padding: 10px;
      cursor: pointer;
      z-index: 10;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .left {
      left: 20px;
    }

    .right {
      right: 20px;
    }

    /* Styling for dots navigation */
    .dots {
      text-align: center;
      padding: 15px;
    }

    .dot {
      display: inline-block;
      height: 15px;
      width: 15px;
      margin: 0 5px;
      background-color: #bbb;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .active-dot {
      background-color: #3273dc;
    }

    .court-title {
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #3273dc;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar has-background-black">
    <div class="navbar-brand">
      <a class="navbar-item has-text-white" href="pickler-pointer.html">
        <span class="ml-2 is-size-4">Picklers</span>
      </a>
      <div class="navbar-burger burger" data-target="navbarMenu">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div id="navbarMenu" class="navbar-menu has-background-black">
      <div class="navbar-start">
        <a class="navbar-item has-text-white" href="pickler-pointer.html">
          Pickler Pointer
        </a>
        <a class="navbar-item has-text-white" href="leagues.html">Leagues</a>
        <a class="navbar-item has-text-white" href="profile.html">Profile</a>
        <a class="navbar-item has-text-white" href="courtTimes.html">
          Court Times
        </a>
      </div>
      <div class="navbar-end">
        <div class="navbar-item">
          <a class="has-text-white" id="navbar-greeting" href="profile.html">
            Hello, Guest
          </a>
        </div>
        <div class="navbar-item">
          <button class="button is-danger is-small" id="nav-logout-btn">
            Log Out
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <section class="main-content container">
    <h1 class="title has-text-centered">Court Availability</h1>

    <!-- Courts -->
    <div id="court-list">
      <!-- Court Items Injected via JS -->
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer has-background-primary has-text-white">
    <div class="content has-text-centered">
      <p>&copy; 2025 Picklers App | Built with ❤️ from group-7</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bulma-carousel/4.0.4/bulma-carousel.min.js"></script>
  <script>
    const courts = [
      {
        name: "Allegheny Commons Park",
        images: [
          { day: "Monday", file: "assets/courttimes/monday1.jpg" },
          { day: "Tuesday", file: "assets/courttimes/tuesday1.jpg" },
          { day: "Wednesday", file: "assets/courttimes/wednesday1.jpg" },
          { day: "Thursday", file: "assets/courttimes/thursday1.jpg" },
          { day: "Friday", file: "assets/courttimes/friday1.jpg" },
          { day: "Saturday", file: "assets/courttimes/saturday1.jpg" },
        ]
      },
      {
        name: "West Penn Community Recreation Center",
        images: [
          { day: "Monday", file: "assets/courttimes/monday2.jpg" },
          { day: "Tuesday", file: "assets/courttimes/tuesday2.jpg" },
          { day: "Wednesday", file: "assets/courttimes/wednesday2.jpg" },
          { day: "Thursday", file: "assets/courttimes/thursday2.jpg" },
          { day: "Friday", file: "assets/courttimes/friday2.jpg" },
          { day: "Saturday", file: "assets/courttimes/saturday2.jpg" },
        ]
      },
      {
        name: "Moore Park",
        images: [
          { day: "Monday", file: "assets/courttimes/monday3.jpg" },
          { day: "Tuesday", file: "assets/courttimes/tuesday3.jpg" },
          { day: "Wednesday", file: "assets/courttimes/wednesday3.jpg" },
          { day: "Thursday", file: "assets/courttimes/thursday3.jpg" },
          { day: "Friday", file: "assets/courttimes/friday3.jpg" },
          { day: "Saturday", file: "assets/courttimes/saturday3.jpg" },
        ]
      },
      {
        name: "GreenTree SportsPlex and Fitness Center",
        images: [
          { day: "Monday", file: "assets/courttimes/monday4.jpg" },
          { day: "Tuesday", file: "assets/courttimes/tuesday4.jpg" },
          { day: "Wednesday", file: "assets/courttimes/wednesday4.jpg" },
          { day: "Thursday", file: "assets/courttimes/thursday4.jpg" },
          { day: "Friday", file: "assets/courttimes/friday4.jpg" },
          { day: "Saturday", file: "assets/courttimes/saturday4.jpg" },
        ]
      }
    ];

    const courtList = document.getElementById("court-list");

    courts.forEach((court, index) => {
      const section = document.createElement("div");
      section.className = "court-section";

      section.innerHTML = `
        <h2 class="title is-4 court-title">${court.name}</h2>
        <div class="carousel-container" id="carousel-${index}">
          <div class="carousel-images">
            ${court.images.map(image => `
              <img src="${image.file}" alt="${court.name} - ${image.day}">
            `).join("")}
          </div>
          <button class="arrow left" onclick="moveSlide(${index}, -1)">&#10094;</button>
          <button class="arrow right" onclick="moveSlide(${index}, 1)">&#10095;</button>
          <div class="dots" id="dots-${index}">
            ${court.images.map((_, i) => `<span class="dot" onclick="currentSlide(${index}, ${i})"></span>`).join('')}
          </div>
        </div>
      `;

      courtList.appendChild(section);
    });

    let currentIndex = Array(courts.length).fill(0);

    function moveSlide(courtIndex, step) {
      currentIndex[courtIndex] += step;
      const totalSlides = courts[courtIndex].images.length;
      if (currentIndex[courtIndex] < 0) currentIndex[courtIndex] = totalSlides - 1;
      if (currentIndex[courtIndex] >= totalSlides) currentIndex[courtIndex] = 0;
      updateCarousel(courtIndex);
    }

    function currentSlide(courtIndex, index) {
      currentIndex[courtIndex] = index;
      updateCarousel(courtIndex);
    }

    function updateCarousel(courtIndex) {
      const carouselImages = document.querySelector(`#carousel-${courtIndex} .carousel-images`);
      const dots = document.querySelectorAll(`#dots-${courtIndex} .dot`);
      
      // Update the transform property to show the current slide
      carouselImages.style.transform = `translateX(-${currentIndex[courtIndex] * 100}%)`;
      
      // Update the active dot
      dots.forEach((dot, index) => {
        if (index === currentIndex[courtIndex]) {
          dot.classList.add('active-dot');
        } else {
          dot.classList.remove('active-dot');
        }
      });
    }

    // Initialize carousels
    document.addEventListener('DOMContentLoaded', () => {
      courts.forEach((_, index) => {
        updateCarousel(index);
        // Set first dot as active initially
        const firstDot = document.querySelector(`#dots-${index} .dot`);
        if (firstDot) firstDot.classList.add('active-dot');
      });
    });
  </script>

</body>
</html>
